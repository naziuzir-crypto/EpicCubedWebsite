<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpicCubedHead - Arcade Games (v1.0.5)</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #version-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #888;
            background: rgba(255,255,255,0.05);
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #333;
        }

        .menu-container {
            background: rgba(20, 20, 20, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 2px solid #333;
            text-align: center;
            min-width: 350px;
            max-width: 550px;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 1px;
            color: #fff;
        }

        .nav-buttons-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-news-link {
            display: inline-block;
            background: linear-gradient(135deg, #111 0%, #222 100%);
            color: #00ff66;
            border: 2px solid #00ff66;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-news-link:hover {
            background: #00ff66;
            color: black;
        }

        .btn-oldgames-link {
            display: inline-block;
            background: linear-gradient(135deg, #111 0%, #222 100%);
            color: #ff0055;
            border: 2px solid #ff0055;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.2s;
        }

        .btn-oldgames-link:hover {
            background: #ff0055;
            color: white;
        }

        .world-list {
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .world-item {
            background: #222;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #444;
        }

        .world-info {
            text-align: left;
            cursor: pointer;
            flex-grow: 1;
        }

        .world-name {
            font-weight: bold;
        }

        .world-meta {
            font-size: 11px;
            color: #aaa;
            margin-top: 2px;
        }

        .world-actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-delete {
            background: #ff3333;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            background: #111;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        .btn-main {
            background: #00ff66;
            color: black;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 85%;
        }

        #game-area {
            display: none;
            position: relative;
        }

        canvas {
            background-color: #111111;
            border: 4px solid #333333;
            border-radius: 12px;
        }

        #editor-toolbar {
            display: none;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.95);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #444;
            gap: 10px;
            z-index: 100;
            align-items: center;
        }

        #editor-toolbar button {
            color: white;
            padding: 8px 14px;
            border: 1px solid #555;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }

        #editor-toolbar button.active {
            border-color: #00ff66;
            box-shadow: 0 0 8px rgba(0,255,102,0.5);
        }
    </style>
</head>
<body>

    <div id="version-tag">version:1.0.5</div>

    <div id="world-menu" class="menu-container">
        <h1>Select World 🌍</h1>
        
        <div class="nav-buttons-container">
            <a href="news.html" class="btn-news-link">📰 Read CubeNews Daily</a>
            <a href="oldgames.html" class="btn-oldgames-link">🕹️ Play CubeOldGames</a>
        </div>

        <div class="world-list" id="worlds-container"></div>
        <hr style="border: 1px solid #333; margin: 20px 0;">
        <input type="text" id="new-world-name" placeholder="Enter World Name..." maxlength="15">
        <button class="btn-main" onclick="createNewWorld()">Create New World ➕</button>
    </div>

    <div id="editor-toolbar">
        <button onclick="setEditorTool('player')" id="tool-player" style="background: #007bff;">👤 Player</button>
        <button onclick="setEditorTool('obstacle')" id="tool-obstacle" style="background: #ff3333;">🔺 Obstacle</button>
        <button onclick="setEditorTool('portal')" id="tool-portal" style="background: #a020f0;">🌀 Teleport</button>
        <button onclick="setEditorTool('trophy')" id="tool-trophy" style="background: #ffd700;">🏆 Trophy</button>
        <button onclick="setEditorTool('eraser')" id="tool-eraser" style="background: #dc3545;">🧽 Eraser</button>
        
        <div style="width: 2px; height: 25px; background: #444; margin: 0 5px;"></div>
        
        <button onclick="editorUndo()" style="background: #555;" title="Ctrl + Z">↩️ Undo</button>
        <button onclick="editorRedo()" style="background: #555;" title="Ctrl + Y">↪️ Redo</button>
        
        <div style="width: 2px; height: 25px; background: #444; margin: 0 5px;"></div>
        
        <button onclick="startPlaytesting()" style="background: #28a745; color: white;" id="btn-playtest">▶️ START GAME</button>
        <button onclick="exitEditor()" style="background: #444;">💾 Save & Exit</button>
    </div>

    <div id="game-area">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 40; 
        const PLAYER_SPEED = 5; 

        function drawPixelObstacle(x, y, w, h) {
            ctx.fillStyle = '#cc0000';
            ctx.beginPath(); ctx.moveTo(x + w/2, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#ff3333'; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = '#550000'; ctx.fillRect(x + w/2 - 3, y + h/2, 6, 4);
        }

        function drawPixelPortal(x, y, w, h) {
            ctx.fillStyle = '#510066'; ctx.fillRect(x + 4, y, w - 8, h);
            ctx.fillStyle = '#a100cc';
            for(let i = 4; i < h; i += 8) { ctx.fillRect(x + 4, y + i, w - 8, 3); }
            ctx.strokeStyle = '#ff66ff'; ctx.lineWidth = 2; ctx.strokeRect(x + 4, y, w - 8, h);
        }

        function drawPixelTrophy(x, y, w, h) {
            ctx.fillStyle = '#b5b5b5'; ctx.fillRect(x + 4, y + 4, w - 8, h - 8);
            ctx.fillStyle = '#ffff00'; ctx.fillRect(x + 8, y + h - 12, w - 16, 6);
            ctx.fillRect(x + 12, y + h - 20, w - 24, 8); ctx.fillRect(x + 16, y + h - 28, w - 32, 8);
            ctx.fillRect(x + w/2 - 3, y + 8, 6, 12); ctx.fillRect(x + w/2 - 8, y + 11, 16, 4);
            ctx.strokeStyle = '#000000'; ctx.lineWidth = 3; ctx.strokeRect(x + 4, y + 4, w - 8, h - 8);
        }

        let worlds = JSON.parse(localStorage.getItem('epic_cubed_worlds')) || [];
        let currentWorldIndex = null;
        let isEditorMode = false;
        let currentTool = 'obstacle';

        let undoStack = [];
        let redoStack = [];

        let levelData = { playerStart: { x: 80, y: 320 }, obstacles: [], portals: [], trophies: [] };
        let player = { x: 80, y: 320, width: 32, height: 32, vy: 0, vx: 0, isGrounded: true, lastPortalTime: 0 };
        let keys = { a: false, d: false, ArrowLeft: false, ArrowRight: false }; 
        let gameActive = false;
        const gravity = 0.6;

        renderWorlds();

        function renderWorlds() {
            const container = document.getElementById('worlds-container');
            container.innerHTML = '';
            if (worlds.length === 0) {
                container.innerHTML = '<div style="color: #666; margin-top: 20px;">No worlds found. Create one below!</div>';
                return;
            }
            worlds.forEach((world, index) => {
                const item = document.createElement('div');
                item.className = 'world-item';
                item.innerHTML = `
                    <div class="world-info" onclick="playWorld(${index})">
                        <div class="world-name">${world.name}</div>
                        <div class="world-meta">Last played: ${world.date}</div>
                    </div>
                    <div class="world-actions">
                        <button class="btn-edit" onclick="editWorld(${index})">✏️</button>
                        <button class="btn-delete" onclick="deleteWorld(${index})">🗑️</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function createNewWorld() {
            const input = document.getElementById('new-world-name');
            const name = input.value.trim();
            if (!name) return;

            const newWorld = {
                name: name,
                date: new Date().toLocaleDateString(),
                level: {
                    playerStart: { x: 80, y: 320 },
                    obstacles: [{ x: 400, y: 320, width: 40, height: 40 }],
                    portals: [],
                    trophies: [{ x: 720, y: 320, width: 40, height: 40 }]
                }
            };
            worlds.push(newWorld);
            localStorage.setItem('epic_cubed_worlds', JSON.stringify(worlds));
            input.value = '';
            renderWorlds();
        }

        function deleteWorld(index) {
            worlds.splice(index, 1);
            localStorage.setItem('epic_cubed_worlds', JSON.stringify(worlds));
            renderWorlds();
        }

        function saveHistoryState() {
            undoStack.push(JSON.stringify(levelData));
            redoStack = []; 
        }

        function editorUndo() {
            if (undoStack.length === 0) return;
            redoStack.push(JSON.stringify(levelData));
            levelData = JSON.parse(undoStack.pop());
            drawEditor();
        }

        function editorRedo() {
            if (redoStack.length === 0) return;
            undoStack.push(JSON.stringify(levelData));
            levelData = JSON.parse(redoStack.pop());
            drawEditor();
        }

        function editWorld(index) {
            currentWorldIndex = index;
            isEditorMode = true; gameActive = false;
            levelData = worlds[index].level;
            if (!levelData.portals) levelData.portals = [];
            if (!levelData.trophies) levelData.trophies = [];
            undoStack = []; redoStack = [];
            document.getElementById('world-menu').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('editor-toolbar').style.display = 'flex';
            document.getElementById('btn-playtest').innerHTML = "▶️ START GAME";
            setEditorTool('obstacle'); drawEditor();
        }

        function setEditorTool(tool) {
            currentTool = tool;
            document.querySelectorAll('#editor-toolbar button').forEach(btn => btn.classList.remove('active'));
            const targetBtn = document.getElementById(`tool-${tool}`);
            if (targetBtn) targetBtn.classList.add('active');
        }

        function drawEditor() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#222222'; ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += GRID_SIZE) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y < canvas.height; y += GRID_SIZE) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
            ctx.fillStyle = '#2d2d2d'; ctx.fillRect(0, 360, canvas.width, 40);
            ctx.fillStyle = '#007bff'; ctx.fillRect(levelData.playerStart.x, levelData.playerStart.y, 32, 32);
            ctx.strokeStyle = '#ffffff'; ctx.strokeRect(levelData.playerStart.x, levelData.playerStart.y, 32, 32);
            levelData.obstacles.forEach(obs => drawPixelObstacle(obs.x, obs.y, obs.width, obs.height));
            levelData.portals.forEach((portal, i) => {
                drawPixelPortal(portal.x, portal.y, portal.width, portal.height);
                ctx.fillStyle = 'white'; ctx.font = '10px monospace'; ctx.fillText(`P${Math.floor(i/2) + 1}.${(i%2)+1}`, portal.x + 5, portal.y - 4);
            });
            levelData.trophies.forEach(trophy => drawPixelTrophy(trophy.x, trophy.y, trophy.width, trophy.height));
        }

        canvas.addEventListener('mousedown', function(e) {
            if (!isEditorMode || gameActive) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = Math.floor((e.clientX - rect.left) / GRID_SIZE) * GRID_SIZE;
            const mouseY = Math.floor((e.clientY - rect.top) / GRID_SIZE) * GRID_SIZE;
            if (mouseY >= 360) return; 
            saveHistoryState();
            if (currentTool === 'player') { levelData.playerStart = { x: mouseX + 4, y: mouseY + 4 }; } 
            else if (currentTool === 'obstacle') { clearCell(mouseX, mouseY); levelData.obstacles.push({ x: mouseX, y: mouseY, width: GRID_SIZE, height: GRID_SIZE }); } 
            else if (currentTool === 'portal') { clearCell(mouseX, mouseY); levelData.portals.push({ x: mouseX, y: mouseY, width: GRID_SIZE, height: GRID_SIZE }); }
            else if (currentTool === 'trophy') { clearCell(mouseX, mouseY); levelData.trophies.push({ x: mouseX, y: mouseY, width: GRID_SIZE, height: GRID_SIZE }); }
            else if (currentTool === 'eraser') { clearCell(mouseX, mouseY); }
            drawEditor();
        });

        function clearCell(x, y) {
            levelData.obstacles = levelData.obstacles.filter(obs => obs.x !== x || y !== obs.y);
            levelData.portals = levelData.portals.filter(p => p.x !== x || y !== p.y);
            levelData.trophies = levelData.trophies.filter(t => t.x !== x || y !== t.y);
        }

        function startPlaytesting() {
            if (!gameActive) {
                gameActive = true; document.getElementById('btn-playtest').innerHTML = "⏹️ STOP TEST";
                document.getElementById('btn-playtest').style.background = '#dc3545';
                player.x = levelData.playerStart.x; player.y = levelData.playerStart.y;
                player.vy = 0; player.vx = 0; player.isGrounded = true; player.lastPortalTime = 0;
                gameLoop();
            } else {
                gameActive = false; document.getElementById('btn-playtest').innerHTML = "▶️ START GAME";
                document.getElementById('btn-playtest').style.background = '#28a745';
                keys = { a: false, d: false, ArrowLeft: false, ArrowRight: false }; drawEditor();
            }
        }

        window.addEventListener('keydown', function(e) {
            if (gameActive && (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && player.isGrounded) { player.vy = -12; player.isGrounded = false; }
            if (e.code === 'KeyA') keys.a = true; if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'ArrowLeft') keys.ArrowLeft = true; if (e.code === 'ArrowRight') keys.ArrowRight = true;
            if (isEditorMode && !gameActive) {
                if (e.ctrlKey && e.key.toLowerCase() === 'z') { e.preventDefault(); editorUndo(); }
                if (e.ctrlKey && e.key.toLowerCase() === 'y') { e.preventDefault(); editorRedo(); }
            }
        });

        window.addEventListener('keyup', function(e) {
            if (e.code === 'KeyA') keys.a = false; if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false; if (e.code === 'ArrowRight') keys.ArrowRight = false;
        });

        function exitEditor() {
            worlds[currentWorldIndex].level = levelData;
            worlds[currentWorldIndex].date = new Date().toLocaleDateString();
            localStorage.setItem('epic_cubed_worlds', JSON.stringify(worlds));
            isEditorMode = false; gameActive = false;
            document.getElementById('editor-toolbar').style.display = 'none';
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('world-menu').style.display = 'block';
            renderWorlds();
        }

        function playWorld(index) {
            currentWorldIndex = index; isEditorMode = false;
            levelData = worlds[index].level;
            if (!levelData.portals) levelData.portals = [];
            if (!levelData.trophies) levelData.trophies = [];
            document.getElementById('world-menu').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            player.x = levelData.playerStart.x; player.y = levelData.playerStart.y;
            player.vy = 0; player.vx = 0; player.isGrounded = true; player.lastPortalTime = 0;
            gameActive = true; gameLoop();
        }

        function gameLoop() {
            if (!gameActive) return;
            player.vx = 0;
            if (keys.a || keys.ArrowLeft) player.vx = -PLAYER_SPEED;
            if (keys.d || keys.ArrowRight) player.vx = PLAYER_SPEED;
            player.vy += gravity; player.y += player.vy; player.x += player.vx;
            if (player.y >= 328) { player.y = 328; player.vy = 0; player.isGrounded = true; }
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;

            levelData.obstacles.forEach(obs => {
                if (player.x < obs.x + obs.width && player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height && player.y + player.height > obs.y) {
                    player.x = levelData.playerStart.x; player.y = levelData.playerStart.y; player.vy = 0; player.vx = 0;
                }
            });

            const now = Date.now();
            if (now - player.lastPortalTime > 800) { 
                for (let i = 0; i < levelData.portals.length; i++) {
                    let portal = levelData.portals[i];
                    if (player.x < portal.x + portal.width && player.x + player.width > portal.x &&
                        player.y < portal.y + portal.height && player.y + player.height > portal.y) {
                        let targetIndex = (i % 2 === 0) ? i + 1 : i - 1;
                        if (levelData.portals[targetIndex]) {
                            player.x = levelData.portals[targetIndex].x; player.y = levelData.portals[targetIndex].y;
                            player.lastPortalTime = now; break;
                        }
                    }
                }
            }

            levelData.trophies.forEach(trophy => {
                if (player.x < trophy.x + trophy.width && player.x + player.width > trophy.x &&
                    player.y < trophy.y + trophy.height && player.y + player.height > trophy.y) {
                    gameActive = false; alert("🏆 WORLD COMPLETED SUCCESSFULLY! 🏆");
                    if (isEditorMode) { startPlaytesting(); } 
                    else { document.getElementById('game-area').style.display = 'none'; document.getElementById('world-menu').style.display = 'block'; renderWorlds(); }
                }
            });

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#2d2d2d'; ctx.fillRect(0, 360, canvas.width, 40);
            ctx.fillStyle = '#00ff66'; ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.strokeStyle = '#ffffff'; ctx.strokeRect(player.x, player.y, player.width, player.height);
            levelData.obstacles.forEach(obs => drawPixelObstacle(obs.x, obs.y, obs.width, obs.height));
            levelData.portals.forEach(portal => drawPixelPortal(portal.x, portal.y, portal.width, portal.height));
            levelData.trophies.forEach(trophy => drawPixelTrophy(trophy.x, trophy.y, trophy.width, trophy.height));
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
