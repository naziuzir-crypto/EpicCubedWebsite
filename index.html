<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpicCubedHead - Arcade Games (v1.0.5)</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #version-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #888;
            background: rgba(255,255,255,0.05);
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #333;
        }

        .menu-container {
            background: rgba(20, 20, 20, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 2px solid #333;
            text-align: center;
            min-width: 350px;
            max-width: 500px;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 1px;
            color: #fff;
        }

        .btn-news {
            display: inline-block;
            background: linear-gradient(135deg, #111 0%, #222 100%);
            color: #00ff66;
            border: 2px solid #00ff66;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .btn-news:hover {
            background: #00ff66;
            color: black;
        }

        .world-list {
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .world-item {
            background: #222;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #444;
        }

        .world-info {
            text-align: left;
            cursor: pointer;
            flex-grow: 1;
        }

        .world-name {
            font-weight: bold;
        }

        .world-meta {
            font-size: 11px;
            color: #aaa;
            margin-top: 2px;
        }

        .world-actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-delete {
            background: #ff3333;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            background: #111;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
        }

        .btn-main {
            background: #00ff66;
            color: black;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 85%;
        }

        #game-area {
            display: none;
            position: relative;
        }

        canvas {
            background-color: #111111;
            border: 4px solid #333333;
            border-radius: 12px;
        }

        /* סרגל כלים משודרג */
        #editor-toolbar {
            display: none;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.95);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #444;
            gap: 10px;
            z-index: 100;
            align-items: center;
        }

        #editor-toolbar button {
            color: white;
            padding: 8px 14px;
            border: 1px solid #555;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }

        #editor-toolbar button.active {
            border-color: #00ff66;
            box-shadow: 0 0 8px rgba(0,255,102,0.5);
        }
    </style>
</head>
<body>

    <div id="version-tag">version:1.0.5</div>

    <div id="world-menu" class="menu-container">
        <h1>Select World 🌍</h1>
        <a href="news.html" class="btn-news">📰 Read CubeNews Daily</a>
        <div class="world-list" id="worlds-container"></div>
        <hr style="border: 1px solid #333; margin: 20px 0;">
        <input type="text" id="new-world-name" placeholder="Enter World Name..." maxlength="15">
        <button class="btn-main" onclick="createNewWorld()">Create New World ➕</button>
    </div>

    <div id="editor-toolbar">
        <button onclick="setEditorTool('player')" id="tool-player" style="background: #007bff;">👤 Player</button>
        <button onclick="setEditorTool('obstacle')" id="tool-obstacle" style="background: #ff3333;">🔺 Obstacle</button>
        <button onclick="setEditorTool('portal')" id="tool-portal" style="background: #00ff66;">🌀 Portal</button>
        <button onclick="setEditorTool('eraser')" id="tool-eraser" style="background: #dc3545;">🧽 Eraser</button>
        
        <div style="width: 2px; height: 25px; background: #444; margin: 0 5px;"></div>
        
        <button onclick="editorUndo()" style="background: #555;" title="Ctrl + Z">↩️ Undo</button>
        <button onclick="editorRedo()" style="background: #555;" title="Ctrl + Y">↪️ Redo</button>
        
        <div style="width: 2px; height: 25px; background: #444; margin: 0 5px;"></div>
        
        <button onclick="startPlaytesting()" style="background: #28a745; color: white;" id="btn-playtest">▶️ START GAME</button>
        <button onclick="exitEditor()" style="background: #444;">💾 Save & Exit</button>
    </div>

    <div id="game-area">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GRID_SIZE = 40; // גודל משבצת גריד של 16-ביט

        let worlds = JSON.parse(localStorage.getItem('epic_cubed_worlds')) || [];
        let currentWorldIndex = null;
        let isEditorMode = false;
        let currentTool = 'obstacle';

        let undoStack = [];
        let redoStack = [];

        let levelData = {
            playerStart: { x: 80, y: 320 },
            obstacles: [],
            portals: []
        };

        let player = { x: 80, y: 320, width: 32, height: 32, vy: 0, isGrounded: true };
        let gameActive = false;
        const gravity = 0.6;

        renderWorlds();

        function renderWorlds() {
            const container = document.getElementById('worlds-container');
            container.innerHTML = '';
            if (worlds.length === 0) {
                container.innerHTML = '<div style="color: #666; margin-top: 20px;">No worlds found. Create one below!</div>';
                return;
            }
            worlds.forEach((world, index) => {
                const item = document.createElement('div');
                item.className = 'world-item';
                item.innerHTML = `
                    <div class="world-info" onclick="playWorld(${index})">
                        <div class="world-name">${world.name}</div>
                        <div class="world-meta">Last played: ${world.date}</div>
                    </div>
                    <div class="world-actions">
                        <button class="btn-edit" onclick="editWorld(${index})">✏️</button>
                        <button class="btn-delete" onclick="deleteWorld(${index})">🗑️</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function createNewWorld() {
            const input = document.getElementById('new-world-name');
            const name = input.value.trim();
            if (!name) return;

            const newWorld = {
                name: name,
                date: new Date().toLocaleDateString(),
                level: {
                    playerStart: { x: 80, y: 320 },
                    obstacles: [{ x: 400, y: 320, width: 40, height: 40 }, { x: 600, y: 320, width: 40, height: 40 }],
                    portals: [{ x: 720, y: 280, width: 40, height: 80 }]
                }
            };

            worlds.push(newWorld);
            localStorage.setItem('epic_cubed_worlds', JSON.stringify(worlds));
            input.value = '';
            renderWorlds();
        }

        function deleteWorld(index) {
            worlds.splice(index, 1);
            localStorage.setItem('epic_cubed_worlds', JSON.stringify(worlds));
            renderWorlds();
        }

        function saveHistoryState() {
            undoStack.push(JSON.stringify(levelData));
            redoStack = []; 
        }

        function editorUndo() {
            if (undoStack.length === 0) return;
            redoStack.push(JSON.stringify(levelData));
            levelData = JSON.parse(undoStack.pop());
            drawEditor();
        }

        function editorRedo() {
            if (redoStack.length === 0) return;
            undoStack.push(JSON.stringify(levelData));
            levelData = JSON.parse(redoStack.pop());
            drawEditor();
        }

        function editWorld(index) {
            currentWorldIndex = index;
            isEditorMode = true;
            gameActive = false;
            levelData = worlds[index].level;
            
            undoStack = [];
            redoStack = [];

            document.getElementById('world-menu').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('editor-toolbar').style.display = 'flex';
            document.getElementById('btn-playtest').innerHTML = "▶️ START GAME";
            
            setEditorTool('obstacle');
            drawEditor();
        }

        function setEditorTool(tool) {
            currentTool = tool;
            document.querySelectorAll('#editor-toolbar button').forEach(btn => btn.classList.remove('active'));
            const targetBtn = document.getElementById(`tool-${tool}`);
            if (targetBtn) targetBtn.classList.add('active');
        }

        // פונקציית ציור הגריד והעורך בסגנון 16-ביט
        function drawEditor() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // ציור רשת משבצות (Grid) ברקע
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += GRID_SIZE) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += GRID_SIZE) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // רצפה מודגשת בגריד
            ctx.fillStyle = '#2d2d2d';
            ctx.fillRect(0, 360, canvas.width, 40);
            ctx.strokeStyle = '#444';
            ctx.strokeRect(0, 360, canvas.width, 40);

            // שחקן (התחלה)
            ctx.fillStyle = '#007bff';
            ctx.fillRect(levelData.playerStart.x, levelData.playerStart.y, 32, 32);
            ctx.strokeStyle = '#ffffff'; ctx.strokeRect(levelData.playerStart.x, levelData.playerStart.y, 32, 32);
            ctx.fillStyle = 'white'; ctx.font = '10px monospace';
            ctx.fillText("START", levelData.playerStart.x - 2, levelData.playerStart.y - 6);

            // מכשולים
            ctx.fillStyle = '#ff3333';
            levelData.obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.strokeStyle = '#ff9999'; ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            });

            // פורטלים
            levelData.portals.forEach(portal => {
                ctx.fillStyle = '#00ff66';
                ctx.fillRect(portal.x, portal.y, portal.width, portal.height);
                ctx.strokeStyle = '#ffffff'; ctx.strokeRect(portal.x, portal.y, portal.width, portal.height);
            });
        }

        // לחיצת עכבר - ננעלת למשבצות גריד מדויקות של 40 פיקסלים
        canvas.addEventListener('mousedown', function(e) {
            if (!isEditorMode || gameActive) return;

            const rect = canvas.getBoundingClientRect();
            // חישוב המיקום המדויק לפי פינות המשבצת של ה-Grid
            const mouseX = Math.floor((e.clientX - rect.left) / GRID_SIZE) * GRID_SIZE;
            const mouseY = Math.floor((e.clientY - rect.top) / GRID_SIZE) * GRID_SIZE;

            if (mouseY >= 360) return; // לא בונים בתוך הרצפה

            saveHistoryState();

            if (currentTool === 'player') {
                levelData.playerStart = { x: mouseX + 4, y: mouseY + 4 }; // ממורכז קצת במשבצת
            } 
            else if (currentTool === 'obstacle') {
                // בדיקה שלא קיים כבר מכשול שם
                levelData.obstacles = levelData.obstacles.filter(obs => obs.x !== mouseX || obs.y !== mouseY);
                levelData.obstacles.push({ x: mouseX, y: mouseY, width: GRID_SIZE, height: GRID_SIZE });
            } 
            else if (currentTool === 'portal') {
                levelData.portals = levelData.portals.filter(p => p.x !== mouseX || p.y !== mouseY);
                levelData.portals.push({ x: mouseX, y: mouseY, width: GRID_SIZE, height: GRID_SIZE * 2 }); // פורטל בגובה 2 משבצות
            } 
            else if (currentTool === 'eraser') {
                levelData.obstacles = levelData.obstacles.filter(obs => !(mouseX === obs.x && mouseY === obs.y));
                levelData.portals = levelData.portals.filter(p => !(mouseX === p.x && (mouseY === p.y || mouseY === p.y + GRID_SIZE)));
            }

            drawEditor();
        });

        // כפתור הפעלה ישיר מתוך ה-Editor
        function startPlaytesting() {
            if (!gameActive) {
                // התחלת בדיקה
                gameActive = true;
                document.getElementById('btn-playtest').innerHTML = "⏹️ STOP TEST";
                document.getElementById('btn-playtest').style.background = '#dc3545';
                
                player.x = levelData.playerStart.x;
                player.y = levelData.playerStart.y;
                player.vy = 0;
                player.isGrounded = true;
                
                gameLoop();
            } else {
                // עצירת בדיקה וחזרה לעריכה
                gameActive = false;
                document.getElementById('btn-playtest').innerHTML = "▶️ START GAME";
                document.getElementById('btn-playtest').style.background = '#28a745';
                drawEditor();
            }
        }

        // האזנה למקלדת: תמיכה ב-WASD, חצים וקיצורי דרך לעורך
        window.addEventListener('keydown', function(e) {
            // קפיצה: רווח, חץ למעלה, או W (עובד גם במשחק רגיל וגם בטסט)
            if (gameActive && (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') && player.isGrounded) {
                player.vy = -12;
                player.isGrounded = false;
            }

            // קיצורי דרך לעורך (רק כשלא בתוך משחק פעיל)
            if (isEditorMode && !gameActive) {
                if (e.ctrlKey && e.key.toLowerCase() === 'z') { e.preventDefault(); editorUndo(); }
                if (e.ctrlKey && e.key.toLowerCase() === 'y') { e.preventDefault(); editorRedo(); }
            }
        });

        function exitEditor() {
            worlds[currentWorldIndex].level = levelData;
            worlds[currentWorldIndex].date = new Date().toLocaleDateString();
            localStorage.setItem('epic_cubed_worlds', JSON.stringify(worlds));
            
            isEditorMode = false;
            gameActive = false;
            document.getElementById('editor-toolbar').style.display = 'none';
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('world-menu').style.display = 'block';
            renderWorlds();
        }

        function playWorld(index) {
            currentWorldIndex = index;
            isEditorMode = false;
            levelData = worlds[index].level;

            document.getElementById('world-menu').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';

            player.x = levelData.playerStart.x;
            player.y = levelData.playerStart.y;
            player.vy = 0;
            player.isGrounded = true;

            gameActive = true;
            gameLoop();
        }

        function gameLoop() {
            if (!gameActive) return;

            // פיזיקה ותנועה
            player.vy += gravity;
            player.y += player.vy;

            if (player.y >= 328) { 
                player.y = 328;
                player.vy = 0;
                player.isGrounded = true;
            }

            // בדיקת מכשולים
            levelData.obstacles.forEach(obs => {
                if (player.x < obs.x + obs.width && player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height && player.y + player.height > obs.y) {
                    // מוות - חזרה להתחלה
                    player.x = levelData.playerStart.x;
                    player.y = levelData.playerStart.y;
                    player.vy = 0;
                }
            });

            // בדיקת ניצחון בפורטל
            levelData.portals.forEach(portal => {
                if (player.x < portal.x + portal.width && player.x + player.width > portal.x &&
                    player.y < portal.y + portal.height && player.y + player.height > portal.y) {
                    gameActive = false;
                    alert("World Completed! 🎉");
                    if (isEditorMode) {
                        startPlaytesting(); // מחזיר למצב עריכה בטסט
                    } else {
                        document.getElementById('game-area').style.display = 'none';
                        document.getElementById('world-menu').style.display = 'block';
                        renderWorlds();
                    }
                }
            });

            // ציור לולאת המשחק
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // רצפה
            ctx.fillStyle = '#2d2d2d';
            ctx.fillRect(0, 360, canvas.width, 40);

            // שחקן (קוביה ירוקה זוהרת)
            ctx.fillStyle = '#00ff66';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.strokeStyle = '#ffffff'; ctx.strokeRect(player.x, player.y, player.width, player.height);

            // מכשולים
            ctx.fillStyle = '#ff3333';
            levelData.obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.strokeStyle = '#ff9999'; ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
            });

            // פורטלים
            ctx.fillStyle = '#007bff';
            levelData.portals.forEach(p => {
                ctx.fillRect(p.x, p.y, p.width, p.height);
                ctx.strokeStyle = '#ffffff'; ctx.strokeRect(p.x, p.y, p.width, p.height);
            });

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
