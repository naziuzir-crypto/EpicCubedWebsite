<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpicCubedHead - Arcade Games</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.1s ease;
        }

        #login-screen, #menu-screen {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #4ca1af;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 20px rgba(76, 161, 175, 0.3);
        }

        .input-field {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #4ca1af;
            background: #111;
            color: white;
            font-size: 16px;
            text-align: center;
        }

        .avatar-selection {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .avatar-opt {
            font-size: 30px;
            padding: 8px;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
        }

        .selected-avatar { border-color: #00ffcc; background: rgba(0,255,204,0.1); }

        .btn {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            background: linear-gradient(135deg, #4ca1af, #2c3e50);
            color: white;
            box-shadow: 0 4px 10px rgba(76, 161, 175, 0.2);
        }

        .game-window {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        #run-canvas {
            background: #111;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            cursor: pointer;
        }

        .cube {
            width: 120px;
            height: 120px;
            background-color: #0055ff;
            border: 4px solid #00ffcc;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 85, 255, 0.6);
            cursor: pointer;
            transition: transform 0.05s;
            margin: 20px 0;
        }
        .cube:active { transform: scale(0.92); }

        .shop {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #00ffcc;
            width: 280px;
            margin-top: 20px;
        }
        .shop-btn {
            background: #222;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 8px;
            width: 100%;
            margin: 5px 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        #leaderboard {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #4ca1af;
            width: 280px;
            text-align: center;
        }

        .back-btn { position: absolute; top: 20px; left: 20px; background: #333; color: white; padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; z-index: 100; }
        
        .volume-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #333;
            padding: 8px 15px;
            border-radius: 5px;
            display: none;
            z-index: 100;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        .volume-slider { cursor: pointer; accent-color: #00ffcc; width: 150px; }
    </style>
</head>
<body>

    <div id="vol-ctrl" class="volume-container">
        <span>🎵 Vol: <span id="vol-txt">100%</span></span>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="2000" value="100" oninput="changeVolume(this.value)">
    </div>

    <div id="login-screen">
        <h2>Create Arcade Profile</h2>
        <input type="text" id="username-input" class="input-field" placeholder="Enter Nickname" maxlength="12">
        <div class="avatar-selection">
            <span class="avatar-opt selected-avatar" onclick="selectAvatar(this, '🤖')">🤖</span>
            <span class="avatar-opt" onclick="selectAvatar(this, '🔥')">🔥</span>
            <span class="avatar-opt" onclick="selectAvatar(this, '👑')">👑</span>
        </div>
        <button class="btn" onclick="createProfile()">ENTER ARCADE</button>
    </div>

    <div id="menu-screen" style="display: none;">
        <h2 id="welcome-msg">Welcome</h2>
        <p>Choose a Game to Play:</p>
        <button class="btn" onclick="openGame('reaction')">1. Reaction Time! ⏱️</button>
        <button class="btn" onclick="openGame('clicker')">2. CubeClicker 🟦</button>
        <button class="btn" style="background: linear-gradient(135deg, #ff5500, #ffcc00); color: black;" onclick="openGame('run')">3. CUBE RUN vs DRAGON! 🏃‍♂️🐉</button>
    </div>

    <div id="game-reaction" class="game-window">
        <button class="back-btn" onclick="backToMenu()">← Menu</button>
        <div style="text-align:center; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
            <div id="status-text" style="font-size: 24px; font-weight: bold;">Reaction Time Challenge!</div>
            <div id="result-text" style="font-size: 36px; color: #00ffcc; margin-top: 10px;"></div>
            <button id="start-btn" class="btn" style="width: auto; padding: 10px 30px; margin: 20px auto;" onclick="startReactionGame(event)">START</button>
            <div id="leaderboard">
                <h3>Local Stats 🌍</h3>
                <div id="leaderboard-entries">Ready to test your speed!</div>
            </div>
        </div>
    </div>

    <div id="game-clicker" class="game-window">
        <button class="back-btn" onclick="backToMenu()">← Menu</button>
        <h2>CubeClicker 🟦</h2>
        <div id="cube-score" style="font-size: 28px; font-weight: bold; color: #00ffcc;">Cubes: 0</div>
        <div id="cube-cps" style="font-size: 16px; color: #aaa;">Per Second (CPS): 0</div>
        <div class="cube" onclick="clickCube()"></div>
        <div class="shop">
            <h3>Upgrades Shop</h3>
            <button class="shop-btn" id="up-click-btn" onclick="buyUpgrade('click')">Upgrade Click (+1) | Cost: 15</button>
            <button class="shop-btn" id="up-auto-btn" onclick="buyUpgrade('auto')">Auto Clicker (+1 CPS) | Cost: 50</button>
        </div>
    </div>

    <div id="game-run" class="game-window">
        <button class="back-btn" onclick="backToMenu()">← Menu</button>
        <h2>Cube Run vs Dragon! 🏃‍♂️💨🐉</h2>
        <div id="run-score" style="font-size: 24px; font-weight: bold; color: #ffcc00; margin-bottom: 10px;">Score: 0</div>
        <canvas id="run-canvas" width="550" height="220" onclick="playerJump()"></canvas>
        <p style="font-size: 14px; color: #aaa; margin-top: 10px;">Click screen or press SPACEBAR to Jump over Spikes!</p>
        <button id="run-start-btn" class="btn" style="width: auto; padding: 10px 30px; background: linear-gradient(135deg, #ff5500, #ffcc00); color: black;" onclick="startRunGame()">START RUN</button>
    </div>

    <script>
        let currentUsername = "";
        let currentAvatar = "🤖";
        let audioCtx = null;
        let mainGainNode = null;
        let userVolumeMultiplier = 1.0; 
        let runAnimationId, runScore, runIsPlaying = false;
        let musicInterval = null;

        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'w' || e.key === 'ArrowUp') {
                if (document.getElementById('game-run').style.display === "flex") {
                    e.preventDefault();
                    playerJump();
                }
            }
        });

        function selectAvatar(element, avatarIcon) {
            document.querySelectorAll('.avatar-opt').forEach(opt => opt.classList.remove('selected-avatar'));
            element.classList.add('selected-avatar');
            currentAvatar = avatarIcon;
        }

        function createProfile() {
            const name = document.getElementById('username-input').value.trim();
            if (name === "") { alert("Please enter a nickname!"); return; }
            currentUsername = currentAvatar + " " + name;
            document.getElementById('welcome-msg').innerText = "Welcome, " + currentUsername;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('menu-screen').style.display = "block";
            document.getElementById('vol-ctrl').style.display = "flex";
            initAudio();
        }

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            mainGainNode = audioCtx.createGain();
            mainGainNode.gain.setValueAtTime(0.15 * userVolumeMultiplier, audioCtx.currentTime);
            mainGainNode.connect(audioCtx.destination);
        }

        function changeVolume(value) {
            document.getElementById('vol-txt').innerText = value + "%";
            userVolumeMultiplier = value / 100;
            if (audioCtx) {
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                if (mainGainNode) {
                    mainGainNode.gain.setValueAtTime(0.15 * userVolumeMultiplier, audioCtx.currentTime);
                }
            }
        }

        function openGame(gameType) {
            document.querySelectorAll('.game-window').forEach(w => w.style.display = "none");
            document.getElementById('menu-screen').style.display = "none";
            if (gameType === 'reaction') { document.getElementById('game-reaction').style.display = "flex"; }
            else if (gameType === 'clicker') { document.getElementById('game-clicker').style.display = "flex"; updateClickerUI(); }
            else if (gameType === 'run') { document.getElementById('game-run').style.display = "flex"; initRunGame(); }
        }

        function backToMenu() {
            clearTimeout(timeoutId); cancelAnimationFrame(runAnimationId);
            stopMusic(); runIsPlaying = false; reactionState = "idle";
            document.body.style.backgroundColor = "#000000";
            document.getElementById('start-btn').style.display = "block"; 
            document.querySelectorAll('.game-window').forEach(window => window.style.display = "none");
            document.getElementById('menu-screen').style.display = "block";
        }

        // --- REACTION TIME ---
        let reactionState = "idle"; let startTime = 0; let timeoutId = null;
        function startReactionGame(event) {
            event.stopPropagation(); reactionState = "waiting";
            document.body.style.backgroundColor = "#000000";
            document.getElementById('status-text').innerText = "Wait for Blue..."; document.getElementById('result-text').innerText = ""; document.getElementById('start-btn').style.display = "none";
            timeoutId = setTimeout(() => { 
                reactionState = "clickMe"; 
                document.body.style.backgroundColor = "#0055ff";
                document.getElementById('status-text').innerText = "CLICK NOW!!!"; 
                startTime = window.performance.now(); 
            }, Math.floor(Math.random() * 3000) + 1000);
        }
        document.getElementById('game-reaction').addEventListener('click', () => {
            if (reactionState === "waiting") { clearTimeout(timeoutId); reactionState = "idle"; document.body.style.backgroundColor = "#000000"; document.getElementById('status-text').innerText = "Too early!"; document.getElementById('start-btn').style.display = "block"; }
            else if (reactionState === "clickMe") { let diff = parseFloat(((window.performance.now() - startTime) / 1000).toFixed(3)); reactionState = "finished"; document.body.style.backgroundColor = "#000000"; document.getElementById('status-text').innerText = "Your Time:"; document.getElementById('result-text').innerText = diff + "s"; document.getElementById('start-btn').style.display = "block"; document.getElementById('leaderboard-entries').innerText = `Last score: ${diff}s!`; }
        });

        // --- CUBE CLICKER ---
        let cubes = 0; let clickPower = 1; let autoClickers = 0; let clickCost = 15; let autoCost = 50;
        function clickCube() { cubes += clickPower; updateClickerUI(); }
        function buyUpgrade(type) {
            if (type === 'click' && cubes >= clickCost) { cubes -= clickCost; clickPower += 1; clickCost = Math.floor(clickCost * 1.5); }
            else if (type === 'auto' && cubes >= autoCost) { cubes -= autoCost; autoClickers += 1; autoCost = Math.floor(autoCost * 1.6); }
            updateClickerUI();
        }
        function updateClickerUI() { document.getElementById('cube-score').innerText = "Cubes: " + cubes; document.getElementById('cube-cps').innerText = "Per Second (CPS): " + autoClickers; document.getElementById('up-click-btn').innerText = `Upgrade Click (+1) | Cost: ${clickCost}`; document.getElementById('up-auto-btn').innerText = `Auto Clicker (+1 CPS) | Cost: ${autoCost}`; }
        setInterval(() => { if (autoClickers > 0 && document.getElementById('game-clicker').style.display === "flex") { cubes += autoClickers; updateClickerUI(); } }, 1000);

        // --- CUBE RUN VS DRAGON WITH SPIKES ---
        const canvas = document.getElementById('run-canvas'); const ctx = canvas.getContext('2d');
        let runner = { x: 140, y: 150, w: 30, h: 30, vy: 0, gravity: 0.6, jumpPower: -11, isGrounded: true };
        let obstacles = []; let obstacleTimer = 0; let gameSpeed = 5;
        
        function initRunGame() { 
            runScore = 0; gameSpeed = 5; obstacles = []; runner.y = 150; runner.vy = 0; runner.isGrounded = true; 
            document.getElementById('run-score').innerText = "Score: 0"; 
            document.getElementById('run-start-btn').style.display = "block"; 
            drawRunScene(); 
        }
        
        // ציור קוצים משולשים קלאסיים
        function drawSpike(x, y, width, height) {
            ctx.fillStyle = "#ff2255";
            ctx.beginPath();
            ctx.moveTo(x, y + height);
            ctx.lineTo(x + width / 2, y);
            ctx.lineTo(x + width, y + height);
            ctx.closePath();
            ctx.fill();
            
            // קו מתאר שחור לקוצים למראה חד
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        
        function drawRunScene() { 
            ctx.clearRect(0, 0, canvas.width, canvas.height); 
            
            // רצפה
            ctx.fillStyle = "#444"; ctx.fillRect(0, 180, canvas.width, 40); 
            
            // דרקון רודף מאחור משמאל
            ctx.font = "45px Arial"; ctx.fillText("🐉", 20, 165);
            
            // השחקן (הקובייה הכחולה)
            ctx.fillStyle = "#0055ff"; ctx.fillRect(runner.x, runner.y, runner.w, runner.h); 
            
            // ציור המכשולים כקוצים משולשים ומכשולים שונים
            obstacles.forEach(obs => {
                if (obs.type === 'spike') {
                    drawSpike(obs.x, obs.y, obs.w, obs.h);
                } else {
                    // מכשול בלוק רגיל לגיוון
                    ctx.fillStyle = "#ffaa00";
                    ctx.fillRect(obs.x, obs.y, obs.w, obs.h);
                }
            });
        }
        
        function startRunGame() { 
            if (runIsPlaying) return; 
            runIsPlaying = true; 
            document.getElementById('run-start-btn').style.display = "none"; 
            startTenseMusic(); 
            updateRunGame(); 
        }
        
        function playerJump() { if (runIsPlaying && runner.isGrounded) { runner.vy = runner.jumpPower; runner.isGrounded = false; } }
        
        function updateRunGame() {
            if (!runIsPlaying) return; 
            
            runner.vy += runner.gravity; runner.y += runner.vy; 
            if (runner.y >= 150) { runner.y = 150; runner.vy = 0; runner.isGrounded = true; }
            
            obstacleTimer++;
            if (obstacleTimer > Math.floor(Math.random() * 35) + 55) { 
                let isSpike = Math.random() > 0.3; // 70% סיכוי לקוצים
                if (isSpike) {
                    obstacles.push({ x: canvas.width, y: 150, w: 25, h: 30, type: 'spike' });
                } else {
                    obstacles.push({ x: canvas.width, y: 155, w: 20, h: 25, type: 'block' });
                }
                obstacleTimer = 0; 
            }
            
            for (let i = obstacles.length - 1; i >= 0; i--) { 
                obstacles[i].x -= gameSpeed; 
                
                // בדיקת פגיעה מדויקת במכשול / קוץ
                if (runner.x < obstacles[i].x + obstacles[i].w && 
                    runner.x + runner.w > obstacles[i].x && 
                    runner.y < obstacles[i].y + obstacles[i].h && 
                    runner.y + runner.h > obstacles[i].y) { 
                    gameOverRun(); 
                    return; 
                } 
                if (obstacles[i].x + obstacles[i].w < 0) { 
                    obstacles.splice(i, 1); 
                    runScore++; 
                    document.getElementById('run-score').innerText = "Score: " + runScore; 
                    gameSpeed += 0.35; 
                } 
            }
            
            drawRunScene();
            runAnimationId = requestAnimationFrame(updateRunGame);
        }
        
        function gameOverRun() { 
            runIsPlaying = false; 
            stopMusic();
            ctx.fillStyle = "rgba(0,0,0,0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff3300"; ctx.font = "bold 30px Segoe UI"; ctx.textAlign = "center";
            ctx.fillText("THE DRAGON CAUGHT YOU! 💀", canvas.width / 2, canvas.height / 2);
            document.getElementById('run-start-btn').style.display = "block"; 
            document.getElementById('run-start-btn').innerText = "TRY AGAIN"; 
        }

        function startTenseMusic() {
            initAudio();
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            stopMusic();
            musicInterval = setInterval(() => {
                if (!runIsPlaying) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(110 + (Math.random() > 0.5 ? 6 : 0), audioCtx.currentTime);
                    
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    
                    osc.connect(gain);
                    gain.connect(mainGainNode);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                } catch(e) { console.log(e); }
            }, 250);
        }
        function stopMusic() { if (musicInterval) clearInterval(musicInterval); }
    </script>
</body>
</html>
