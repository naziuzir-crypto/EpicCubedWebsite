<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpicCubedHead - Arcade Games</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.1s ease;
        }

        #login-screen, #menu-screen {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #4ca1af;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 20px rgba(76, 161, 175, 0.3);
        }

        .input-field {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #4ca1af;
            background: #111;
            color: white;
            font-size: 16px;
            text-align: center;
        }

        .avatar-selection {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .avatar-opt {
            font-size: 30px;
            padding: 8px;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
        }

        .selected-avatar { border-color: #00ffcc; background: rgba(0,255,204,0.1); }

        .btn {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            background: linear-gradient(135deg, #4ca1af, #2c3e50);
            color: white;
            box-shadow: 0 4px 10px rgba(76, 161, 175, 0.2);
        }

        .game-window {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        #run-canvas, #dragon-canvas {
            background: #111;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            cursor: pointer;
        }

        .back-btn { position: absolute; top: 20px; left: 20px; background: #333; color: white; padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; z-index: 100; }
        
        .volume-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #333;
            padding: 8px 15px;
            border-radius: 5px;
            display: none;
            z-index: 100;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: bold;
        }
        .volume-slider { cursor: pointer; accent-color: #00ffcc; }
    </style>
</head>
<body>

    <div id="vol-ctrl" class="volume-container">
        <span>🎵 Vol: <span id="vol-txt">100%</span></span>
        <input type="range" id="volume-slider" class="volume-slider" min="0" max="500" value="100" oninput="changeVolume(this.value)">
    </div>

    <div id="login-screen">
        <h2>Create Arcade Profile</h2>
        <input type="text" id="username-input" class="input-field" placeholder="Enter Nickname" maxlength="12">
        <div class="avatar-selection">
            <span class="avatar-opt selected-avatar" onclick="selectAvatar(this, '🤖')">🤖</span>
            <span class="avatar-opt" onclick="selectAvatar(this, '🔥')">🔥</span>
            <span class="avatar-opt" onclick="selectAvatar(this, '👑')">👑</span>
        </div>
        <button class="btn" onclick="createProfile()">ENTER ARCADE</button>
    </div>

    <div id="menu-screen" style="display: none;">
        <h2 id="welcome-msg">Welcome</h2>
        <p>Choose a Game to Play:</p>
        <button class="btn" onclick="openGame('run')">1. Cube Run! 跑🏃‍♂️</button>
        <button class="btn" style="background: linear-gradient(135deg, #ff5500, #ffcc00); color: black;" onclick="openGame('dragon')">2. DRAGON RUN (WASD)! 🐉🦈</button>
    </div>

    <div id="game-run" class="game-window">
        <button class="back-btn" onclick="backToMenu()">← Menu</button>
        <h2>Cube Run! 🏃‍♂️💨</h2>
        <div id="run-score" style="font-size: 24px; font-weight: bold; color: #00ffcc; margin-bottom: 10px;">Score: 0</div>
        <canvas id="run-canvas" width="480" height="200" onclick="playerJump()"></canvas>
        <p style="font-size: 14px; color: #aaa; margin-top: 10px;">Click the screen or press SPACEBAR to Jump!</p>
        <button id="run-start-btn" class="btn" style="width: auto; padding: 10px 30px;" onclick="startRunGame()">START RUN</button>
    </div>

    <div id="game-dragon" class="game-window">
        <button class="back-btn" onclick="backToMenu()">← Menu</button>
        <h2 style="color: #ff5500;">🐉 DRAGON MARATHON! 🦈</h2>
        <div id="dragon-score" style="font-size: 24px; font-weight: bold; color: #ffcc00; margin-bottom: 10px;">Survival Time: 0s</div>
        <canvas id="dragon-canvas" width="600" height="350"></canvas>
        <p style="font-size: 14px; color: #aaa; margin-top: 10px;">Move with WASD keys. Click or press SPACEBAR to Jump!</p>
        <button id="dragon-start-btn" class="btn" style="width: auto; padding: 10px 30px; background: linear-gradient(135deg, #ff5500, #ffcc00); color: black;" onclick="startDragonGame()">ESCAPE NOW</button>
    </div>

    <script>
        let currentUsername = "";
        let currentAvatar = "🤖";
        let audioCtx = null;
        let mainGainNode = null;
        let baseVolume = 0.15;
        let dragonIsPlaying = false;
        let runAnimationId, runScore, runIsPlaying = false;
        let dragonAnimationId, dStartTime, dragonMusicInterval;

        function selectAvatar(element, avatarIcon) {
            document.querySelectorAll('.avatar-opt').forEach(opt => opt.classList.remove('selected-avatar'));
            element.classList.add('selected-avatar');
            currentAvatar = avatarIcon;
        }

        function createProfile() {
            const name = document.getElementById('username-input').value.trim();
            if (name === "") { alert("Please enter a nickname!"); return; }
            currentUsername = currentAvatar + " " + name;
            document.getElementById('welcome-msg').innerText = "Welcome, " + currentUsername;
            document.getElementById('login-screen').style.display = "none";
            document.getElementById('menu-screen').style.display = "block";
            document.getElementById('vol-ctrl').style.display = "flex";
            
            // הפעלה בטוחה של מערכת השמע בלי לתקוע את הדפדפן
            try {
                startAudioContext();
            } catch(e) {
                console.log("Audio not allowed yet");
            }
        }

        function startAudioContext() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            mainGainNode = audioCtx.createGain();
            mainGainNode.gain.setValueAtTime(baseVolume, audioCtx.currentTime);
            mainGainNode.connect(audioCtx.destination);
        }

        function changeVolume(value) {
            document.getElementById('vol-txt').innerText = value + "%";
            if (!mainGainNode) return;
            mainGainNode.gain.setValueAtTime((value / 100) * baseVolume, audioCtx.currentTime);
        }

        function openGame(gameType) {
            document.getElementById('menu-screen').style.display = "none";
            if (gameType === 'run') {
                document.getElementById('game-run').style.display = "flex";
                initRunGame();
            } else if (gameType === 'dragon') {
                document.getElementById('game-dragon').style.display = "flex";
                initDragonGame();
            }
        }

        function backToMenu() {
            cancelAnimationFrame(runAnimationId);
            cancelAnimationFrame(dragonAnimationId);
            stopDragonMusic();
            dragonIsPlaying = false;
            document.querySelectorAll('.game-window').forEach(window => window.style.display = "none");
            document.getElementById('menu-screen').style.display = "block";
        }

        // --- CUBE RUN ---
        const canvas = document.getElementById('run-canvas');
        const ctx = canvas.getContext('2d');
        let runner = { x: 50, y: 140, w: 30, h: 30, vy: 0, gravity: 0.6, jumpPower: -11, isGrounded: true };
        let obstacles = [];
        let obstacleTimer = 0;
        let gameSpeed = 5;

        function initRunGame() {
            runScore = 0; gameSpeed = 5; obstacles = []; runner.y = 140; runner.vy = 0; runner.isGrounded = true;
            document.getElementById('run-score').innerText = "Score: 0";
            document.getElementById('run-start-btn').style.display = "block";
            document.getElementById('run-start-btn').innerText = "START RUN";
            drawRunInitial();
        }
        function drawRunInitial() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#555"; ctx.fillRect(0, 170, canvas.width, 30);
            ctx.fillStyle = "#0055ff"; ctx.fillRect(runner.x, runner.y, runner.w, runner.h);
        }
        function startRunGame() {
            if (runIsPlaying) return;
            runIsPlaying = true;
            document.getElementById('run-start-btn').style.display = "none";
            updateRunGame();
        }
        function playerJump() {
            if (runIsPlaying && runner.isGrounded) { runner.vy = runner.jumpPower; runner.isGrounded = false; }
        }
        function updateRunGame() {
            if (!runIsPlaying) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            runner.vy += runner.gravity; runner.y += runner.vy;
            if (runner.y >= 140) { runner.y = 140; runner.vy = 0; runner.isGrounded = true; }
            ctx.fillStyle = "#555"; ctx.fillRect(0, 170, canvas.width, 30);
            ctx.fillStyle = "#0055ff"; ctx.fillRect(runner.x, runner.y, runner.w, runner.h);
            obstacleTimer++;
            if (obstacleTimer > Math.floor(Math.random() * 40) + 60) { obstacles.push({ x: canvas.width, y: 145, w: 20, h: 25 }); obstacleTimer = 0; }
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed;
                ctx.fillStyle = "#ff0055"; ctx.fillRect(obstacles[i].x, obstacles[i].y, obstacles[i].w, obstacles[i].h);
                if (runner.x < obstacles[i].x + obstacles[i].w && runner.x + runner.w > obstacles[i].x && runner.y < obstacles[i].y + obstacles[i].h && runner.y + runner.h > obstacles[i].y) { gameOverRun(); return; }
                if (obstacles[i].x + obstacles[i].w < 0) { obstacles.splice(i, 1); runScore++; document.getElementById('run-score').innerText = "Score: " + runScore; if (runScore % 5 === 0) gameSpeed += 0.5; }
            }
            runAnimationId = requestAnimationFrame(updateRunGame);
        }
        function gameOverRun() { 
            runIsPlaying = false; 
            ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff0055"; ctx.font = "bold 30px 'Segoe UI'"; ctx.textAlign = "center";
            ctx.fillText("GAME OVER 💀", canvas.width / 2, canvas.height / 2);
            document.getElementById('run-start-btn').style.display = "block"; 
            document.getElementById('run-start-btn').innerText = "TRY AGAIN"; 
        }

        // --- WASD DRAGON RUN ---
        const dCanvas = document.getElementById('dragon-canvas');
        const dCtx = dCanvas.getContext('2d');
        let dPlayer = { x: 250, y: 250, w: 25, h: 25, vy: 0, gravity: 0.6, jumpPower: -12, isGrounded: true, speed: 4 };
        let dragon = { x: 20, y: 50, w: 45, h: 45, speed: 1.6 };
        let dSharks = [];
        let dSharkTimer = 0;
        let dKeys = { w: false, a: false, s: false, d: false };

        dCanvas.addEventListener('click', dJump);

        window.addEventListener('keydown', (e) => {
            if (document.getElementById('game-dragon').style.display === "flex") {
                if (e.key === ' ' || e.key === 'w' || e.key === 'ArrowUp') { e.preventDefault(); dJump(); }
                if (e.key === 'a' || e.key === 'ArrowLeft') dKeys.a = true;
                if (e.key === 's' || e.key === 'ArrowDown') dKeys.s = true;
                if (e.key === 'd' || e.key === 'ArrowRight') dKeys.d = true;
            } else if (document.getElementById('game-run').style.display === "flex" && e.key === ' ') { e.preventDefault(); playerJump(); }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'a' || e.key === 'ArrowLeft') dKeys.a = false;
            if (e.key === 's' || e.key === 'ArrowDown') dKeys.s = false;
            if (e.key === 'd' || e.key === 'ArrowRight') dKeys.d = false;
        });

        function dJump() { if (dragonIsPlaying && dPlayer.isGrounded) { dPlayer.vy = dPlayer.jumpPower; dPlayer.isGrounded = false; } }

        function initDragonGame() {
            dragonIsPlaying = false; dPlayer.x = 250; dPlayer.y = 250; dPlayer.vy = 0;
            dragon.x = 20; dragon.y = 50; dSharks = [];
            document.getElementById('dragon-score').innerText = "Survival Time: 0s";
            document.getElementById('dragon-start-btn').style.display = "block";
            drawDragonScene();
        }

        function startDragonGame() {
            if (dragonIsPlaying) return;
            dragonIsPlaying = true;
            dStartTime = Date.now();
            document.getElementById('dragon-start-btn').style.display = "none";
            startTenseMusic();
            updateDragonGame();
        }

        function drawDragonScene() {
            dCtx.clearRect(0, 0, dCanvas.width, dCanvas.height);
            dCtx.fillStyle = "#8b5a2b"; dCtx.fillRect(0, 275, dCanvas.width, 20);
            dCtx.fillStyle = "#0044ff"; dCtx.fillRect(0, 295, dCanvas.width, dCanvas.height - 295);
            dCtx.fillStyle = "#0055ff"; dCtx.fillRect(dPlayer.x, dPlayer.y, dPlayer.w, dPlayer.h);
            dCtx.font = "50px Arial"; dCtx.fillText("🐉", dragon.x, dragon.y);
            dCtx.font = "30px Arial"; dSharks.forEach(s => dCtx.fillText("🦈", s.x, s.y));
        }

        function updateDragonGame() {
            if (!dragonIsPlaying) return;

            let survivalTime = Math.floor((Date.now() - dStartTime) / 1000);
            document.getElementById('dragon-score').innerText = "Survival Time: " + survivalTime + "s";

            if (dKeys.a && dPlayer.x > 0) dPlayer.x -= dPlayer.speed;
            if (dKeys.d && dPlayer.x < dCanvas.width - dPlayer.w) dPlayer.x += dPlayer.speed;
            
            dPlayer.vy += dPlayer.gravity; dPlayer.y += dPlayer.vy;
            if (dPlayer.y >= 250) { dPlayer.y = 250; dPlayer.vy = 0; dPlayer.isGrounded = true; }

            let angle = Math.atan2(dPlayer.y - dragon.y, dPlayer.x - dragon.x);
            dragon.x += Math.cos(angle) * dragon.speed;
            dragon.y += Math.sin(angle) * dragon.speed;

            dSharkTimer++;
            if (dSharkTimer > 60) {
                dSharks.push({ x: dPlayer.x + (Math.random()*160-80), y: 330, vy: -9.5, g: 0.28, w: 25, h: 25 });
                dSharkTimer = 0;
            }
            for (let i = dSharks.length - 1; i >= 0; i--) {
                dSharks[i].vy += dSharks[i].g; dSharks[i].y += dSharks[i].vy;
                if (dSharks[i].y > dCanvas.height) dSharks.splice(i, 1);
            }

            drawDragonScene();

            if (checkCollision(dPlayer, dragon) || dSharks.some(s => checkCollision(dPlayer, s))) {
                gameOverDragon(survivalTime); return;
            }

            dragonAnimationId = requestAnimationFrame(updateDragonGame);
        }

        function checkCollision(a, b) {
            return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
        }

        function gameOverDragon(time) {
            dragonIsPlaying = false; stopDragonMusic();
            dCtx.fillStyle = "rgba(0,0,0,0.85)"; dCtx.fillRect(0, 0, dCanvas.width, dCanvas.height);
            dCtx.fillStyle = "#ff3300"; dCtx.font = "bold 35px Segoe UI"; dCtx.textAlign = "center";
            dCtx.fillText("THE DRAGON CAUGHT YOU! 💀", dCanvas.width / 2, dCanvas.height / 2 - 10);
            dCtx.fillStyle = "#ffffff"; dCtx.font = "18px Segoe UI";
            dCtx.fillText("You survived for: " + time + " seconds", dCanvas.width / 2, dCanvas.height / 2 + 30);
            document.getElementById('dragon-start-btn').style.display = "block";
            document.getElementById('dragon-start-btn').innerText = "TRY AGAIN";
        }

        function startTenseMusic() {
            startAudioContext();
            if (!audioCtx) return; stopDragonMusic();
            dragonMusicInterval = setInterval(() => {
                if (!dragonIsPlaying) return;
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(110 + (Math.random()>0.5?6.54:0), audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.connect(gain); gain.connect(mainGainNode);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
            }, 250);
        }
        function stopDragonMusic() { if (dragonMusicInterval) clearInterval(dragonMusicInterval); }
    </script>
</body>
</html>
