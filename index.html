<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpicCubedHead - Arcade Games (v1.0.5)</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background-color 0.1s ease;
        }

        #version-tag {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #888;
            background: rgba(255,255,255,0.05);
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #333;
        }

        /* מסך בחירת עולמות */
        .menu-container {
            background: rgba(20, 20, 20, 0.95);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 2px solid #333;
            text-align: center;
            min-width: 350px;
            max-width: 500px;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* כפתור ה-CubeNews החדש והמגניב */
        .btn-news {
            display: inline-block;
            background: linear-gradient(135deg, #111 0%, #222 100%);
            color: #00ff66;
            border: 2px solid #00ff66;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            margin-bottom: 20px;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.1);
        }

        .btn-news:hover {
            background: #00ff66;
            color: black;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
            transform: scale(1.03);
        }

        .world-list {
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
        }

        .world-item {
            background: #222;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #444;
            transition: 0.2s;
        }

        .world-item:hover {
            border-color: #00ff66;
            background: #2a2a2a;
        }

        .world-info {
            text-align: left;
            cursor: pointer;
            flex-grow: 1;
        }

        .world-name {
            font-weight: bold;
            color: #fff;
        }

        .world-meta {
            font-size: 11px;
            color: #aaa;
            margin-top: 2px;
        }

        .world-actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-delete {
            background: #ff3333;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            background: #111;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }

        .btn-main {
            background: #00ff66;
            color: black;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            width: 85%;
        }

        .btn-main:hover {
            background: #00cc55;
            box-shadow: 0 0 12px rgba(0,255,102,0.4);
        }

        /* אזור המשחק */
        #game-area {
            display: none;
            position: relative;
        }

        canvas {
            background-color: #111111;
            border: 4px solid #333333;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
        }

        /* סרגל הכלים של ה-Editor */
        #editor-toolbar {
            display: none;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.95);
            padding: 10px 20px;
            border-radius: 10px;
            border: 2px solid #444;
            gap: 10px;
            z-index: 100;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #editor-toolbar button {
            color: white;
            padding: 8px 14px;
            border: 1px solid #555;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.1s;
        }

        #editor-toolbar button.active {
            border-color: #00ff66;
            box-shadow: 0 0 8px rgba(0,255,102,0.5);
        }
    </style>
</head>
<body>

    <div id="version-tag">version:1.0.5</div>

    <div id="world-menu" class="menu-container">
        <h1>Select World 🌍</h1>
        
        <a href="news.html" class="btn-news">📰 Read CubeNews Daily</a>

        <div class="world-list" id="worlds-container"></div>
        <hr style="border: 1px solid #333; margin: 20px 0;">
        <input type="text" id="new-world-name" placeholder="Enter World Name..." maxlength="15">
        <button class="btn-main" onclick="createNewWorld()">Create New World ➕</button>
    </div>

    <div id="editor-toolbar">
        <button onclick="setEditorTool('player')" id="tool-player" style="background: #007bff;">👤 Player</button>
        <button onclick="setEditorTool('obstacle')" id="tool-obstacle" style="background: #222;">🔺 Obstacle</button>
        <button onclick="setEditorTool('portal')" id="tool-portal" style="background: #222;">🌀 Portal</button>
        <button onclick="setEditorTool('eraser')" id="tool-eraser" style="background: #dc3545;">🧽 Eraser</button>
        
        <div style="width: 2px; height: 25px; background: #444; margin: 0 5px;"></div>
        
        <button onclick="editorUndo()" style="background: #555;" title="Ctrl + Z">↩️ Undo</button>
        <button onclick="editorRedo()" style="background: #555;" title="Ctrl + Y">↪️ Redo</button>
        
        <button onclick="exitEditor()" style="background: #28a745; margin-left: 15px;">💾 Save & Exit</button>
    </div>

    <div id="game-area">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // משתני מערכת העולמות והמשחק
        let worlds = JSON.parse(localStorage.getItem('epic_cubed_worlds')) || [];
        let currentWorldIndex = null;
        let isEditorMode = false;
        let currentTool = 'obstacle';

        // מערכת Undo / Redo
        let undoStack = [];
        let redoStack = [];

        // נתוני השלב הנוכחי
        let levelData = {
            playerStart: { x: 100, y: 300 },
            obstacles: [],
            portals: []
        };

        // משתני ריצה למשחק
        let player = { x: 100, y: 300, width: 30, height: 30, vy: 0, isGrounded: true };
        let gameActive = false;
        const gravity = 0.6;

        // טעינה ראשונית של התפריט
        renderWorlds();

        function renderWorlds() {
            const container = document.getElementById('worlds-container');
            container.innerHTML = '';
            
            if (worlds.length === 0) {
                container.innerHTML = '<div style="color: #666; margin-top: 20px;">No worlds found. Create one below!</div>';
                return;
            }

            worlds.forEach((world, index) => {
                const item = document.createElement('div');
                item.className = 'world-item';
                item.innerHTML = `
                    <div class="world-info" onclick="playWorld(${index})">
                        <div class="world-name">${world.name}</div>
                        <div class="world-meta">Last played: ${world.date}</div>
                    </div>
                    <div class="world-actions">
                        <button class="btn-edit" onclick="editWorld(${index})" title="Edit World">✏️</button>
                        <button class="btn-delete" onclick="deleteWorld(${index})">🗑️</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function createNewWorld() {
            const input = document.getElementById('new-world-name');
            const name = input.value.trim();
            if (!name) return;

            const newWorld = {
                name: name,
                date: new Date().toLocaleDateString(),
                level: {
                    playerStart: { x: 100, y: 330 },
                    obstacles: [{ x: 400, y: 330, width: 30, height: 30 }, { x: 600, y: 330, width: 30, height: 30 }],
                    portals: [{ x: 750, y: 310, width: 40, height: 50 }]
                }
            };

            worlds.push(newWorld);
            localStorage.setItem('epic_cubed_worlds', JSON.stringify(worlds));
            input.value = '';
            renderWorlds();
        }

        function deleteWorld(index) {
            worlds.splice(index, 1);
            localStorage.setItem('epic_cubed_worlds', JSON.stringify(worlds));
            renderWorlds();
        }

        // שמירת מצב בשביל Undo
        function saveHistoryState() {
            undoStack.push(JSON.stringify(levelData));
            redoStack = []; 
        }

        // ביצוע Undo (Ctrl+Z)
        function editorUndo() {
            if (undoStack.length === 0) return;
            redoStack.push(JSON.stringify(levelData));
            levelData = JSON.parse(undoStack.pop());
            drawEditor();
        }

        // ביצוע Redo (Ctrl+Y)
        function editorRedo() {
            if (redoStack.length === 0) return;
            undoStack.push(JSON.stringify(levelData));
            levelData = JSON.parse(redoStack.pop());
            drawEditor();
        }

        // כניסה למצב עריכה (העיפרון)
        function editWorld(index) {
            currentWorldIndex = index;
            isEditorMode = true;
            levelData = worlds[index].level;
            
            undoStack = [];
            redoStack = [];

            document.getElementById('world-menu').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('editor-toolbar').style.display = 'flex';
            
            setEditorTool('obstacle');
            drawEditor();
        }

        function setEditorTool(tool) {
            currentTool = tool;
            document.querySelectorAll('#editor-toolbar button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
        }

        // ציור ה-Editor על המסך
        function drawEditor() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#444';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 360);
            ctx.lineTo(canvas.width, 360);
            ctx.stroke();

            ctx.fillStyle = '#007bff';
            ctx.fillRect(levelData.playerStart.x, levelData.playerStart.y, 30, 30);
            ctx.fillStyle = 'white';
            ctx.font = '12px sans-serif';
            ctx.fillText("Start", levelData.playerStart.x - 2, levelData.playerStart.y - 10);

            ctx.fillStyle = '#ff3333';
            levelData.obstacles.forEach(obs => {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            });

            levelData.portals.forEach(portal => {
                ctx.fillStyle = '#00ff66';
                ctx.fillRect(portal.x, portal.y, portal.width, portal.height);
                ctx.strokeStyle = '#00ff66';
                ctx.strokeRect(portal.x - 4, portal.y - 4, portal.width + 8, portal.height + 8);
            });
        }

        canvas.addEventListener('mousedown', function(e) {
            if (!isEditorMode) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = Math.round((e.clientX - rect.left) / 10) * 10; 
            const mouseY = Math.round((e.clientY - rect.top) / 10) * 10;

            saveHistoryState(); 

            if (currentTool === 'player') {
                levelData.playerStart = { x: mouseX - 15, y: mouseY - 15 };
            } 
            else if (currentTool === 'obstacle') {
                levelData.obstacles.push({ x: mouseX - 15, y: mouseY - 15, width: 30, height: 30 });
            } 
            else if (currentTool === 'portal') {
                levelData.portals.push({ x: mouseX - 20, y: mouseY - 25, width: 40, height: 50 });
            } 
            else if (currentTool === 'eraser') {
                levelData.obstacles = levelData.obstacles.filter(obs => 
                    !(mouseX >= obs.x && mouseX <= obs.x + obs.width && mouseY >= obs.y && mouseY <= obs.y + obs.height)
                );
                levelData.portals = levelData.portals.filter(p => 
                    !(mouseX >= p.x && mouseX <= p.x + p.width && mouseY >= p.y && mouseY <= p.y + p.height)
                );
            }

            drawEditor();
        });

        window.addEventListener('keydown', function(e) {
            if (!isEditorMode) return;

            if (e.ctrlKey && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                editorUndo();
            }
            if (e.ctrlKey && e.key.toLowerCase() === 'y') {
                e.preventDefault();
                editorRedo();
            }
        });

        function exitEditor() {
            worlds[currentWorldIndex].level = levelData;
            worlds[currentWorldIndex].date = new Date().toLocaleDateString();
            localStorage.setItem('epic_cubed_worlds', JSON.stringify(worlds));
            
            isEditorMode = false;
            document.getElementById('editor-toolbar').style.display = 'none';
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('world-menu').style.display = 'block';
            renderWorlds();
        }

        function playWorld(index) {
            currentWorldIndex = index;
            isEditorMode = false;
            levelData = worlds[index].level;

            document.getElementById('world-menu').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';

            player.x = levelData.playerStart.x;
            player.y = levelData.playerStart.y;
            player.vy = 0;
            player.isGrounded = true;

            gameActive = true;
            gameLoop();
        }

        window.addEventListener('keydown', function(e) {
            if (gameActive && (e.code === 'Space' || e.code === 'ArrowUp') && player.isGrounded) {
                player.vy = -12;
                player.isGrounded = false;
            }
        });

        function gameLoop() {
            if (!gameActive) return;

            player.vy += gravity;
            player.y += player.vy;

            if (player.y >= 330) { 
                player.y = 330;
                player.vy = 0;
                player.isGrounded = true;
            }

            levelData.obstacles.forEach(obs => {
                if (player.x < obs.x + obs.width && player.x + player.width > obs.x &&
                    player.y < obs.y + obs.height && player.y + player.height > obs.y) {
                    player.x = levelData.playerStart.x;
                    player.y = levelData.playerStart.y;
                }
            });

            levelData.portals.forEach(portal => {
                if (player.x < portal.x + portal.width && player.x + player.width > portal.x &&
                    player.y < portal.y + portal.height && player.y + player.height > portal.y) {
                    alert("World Completed! 🎉");
                    gameActive = false;
                    document.getElementById('game-area').style.display = 'none';
                    document.getElementById('world-menu').style.display = 'block';
                    renderWorlds();
                }
            });

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#333';
            ctx.fillRect(0, 360, canvas.width, 40);

            ctx.fillStyle = '#00ff66';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.fillStyle = '#ff3333';
            levelData.obstacles.forEach(obs => ctx.fillRect(obs.x, obs.y, obs.width, obs.height));

            ctx.fillStyle = '#007bff';
            levelData.portals.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));

            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
